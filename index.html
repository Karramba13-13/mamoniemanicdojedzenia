
<form id="generator-form" class="panel generator-form">
  <h3>1. Co masz w kuchni?</h3>
  <p class="field-hint">Zaznacz składniki, które masz pod ręką. Możesz wybrać kilka kategorii.</p>

  <div class="ingredient-toolbar">
    <input id="ingredient-search" type="search" placeholder="🔎 Szukaj składnika..." aria-label="Szukaj składnika">
    <button id="clear-ingredients" class="button button-ghost" type="button">Wyczyść</button>
  </div>

  <div id="ingredient-categories" class="ingredient-categories"></div>

  <div class="selected-ingredients">
    <strong>Wybrane składniki:</strong>
    <div id="selected-ingredients" class="selected-tags">
      <span class="muted">Nie wybrano jeszcze składników.</span>
    </div>
  </div>

  <div class="preference-divider"></div>

  <h3>2. Na co masz ochotę?</h3>
  <p class="field-hint">Dopasuj propozycję do nastroju, czasu i swoich preferencji.</p>

  <label for="meal-type">Rodzaj posiłku</label>
  <select id="meal-type">
    <option value="all">Wszystko — zaskocz mnie!</option>
    <option value="lunch">Obiad</option>
    <option value="dinner">Kolacja</option>
    <option value="breakfast">Śniadanie</option>
    <option value="soup">Zupa</option>
    <option value="snack">Przekąska</option>
    <option value="sweet">Coś na słodko</option>
  </select>

  <label for="cuisine">Kuchnia</label>
  <select id="cuisine">
    <option value="all">Dowolna kuchnia</option>
    <option value="polish">Polska, domowa</option>
    <option value="italian">Włoska</option>
    <option value="asian">Azjatycka</option>
    <option value="mexican">Meksykańska</option>
    <option value="mediterranean">Śródziemnomorska</option>
    <option value="international">Różne smaki świata</option>
  </select>

  <label for="diet">Sposób odżywiania</label>
  <select id="diet">
    <option value="all">Bez ograniczeń</option>
    <option value="vegetarian">Wegetariańskie</option>
    <option value="vegan">Wegańskie</option>
    <option value="meat">Z mięsem</option>
    <option value="fish">Z rybą</option>
  </select>

  <label for="time">Ile masz czasu?</label>
  <select id="time">
    <option value="any">Bez znaczenia</option>
    <option value="15">Do 15 minut</option>
    <option value="30">Do 30 minut</option>
    <option value="45">Do 45 minut</option>
  </select>

  <button class="button button-primary button-full" type="submit">
    🎲 Znajdź moje danie
  </button>
  <p class="privacy-note">100 przepisów · Bez rejestracji · Bez AI</p>
</form>
